name: Reproduce and check
on:
  push:
    paths-ignore: ["evidence/live/**", "docs/live-run.md"]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m prime_event run --until 100000 --chunk 10000 --output runs/smoke
      - run: python scripts/check_evidence.py
      - run: python scripts/reproduce_u5.py --workdir runs/u5-ci --chunks 1
      - run: python scripts/check_u5_replay.py runs/u5-ci
